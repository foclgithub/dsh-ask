[package]
name = "dsh-ask-ui"
version = "0.1.0"
edition = "2021"
description = "Native terminal display layer for dsh-ask (Codex-style)"
license = "MIT"

[lib]
name = "dsh_ask_ui"
path = "src/lib.rs"

[[bin]]
name = "dsh-ask-ui"
path = "src/main.rs"

[dependencies]
crossterm = "0.28.1"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[profile.release]
opt-level = 2
